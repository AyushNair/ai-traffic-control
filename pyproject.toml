[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-traffic-control"
version = "0.3.0"
description = "Local-first AI data loss prevention gateway for Windows"
requires-python = ">=3.10"
dependencies = [
  "PySide6-Essentials==6.9.3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "keyring>=25,<27",
  "regex>=2024.11,<2027",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["traffic_control*"]
